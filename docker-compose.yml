services:
  rp_nginx:
    container_name: rp_nginx
    image: nginx:1.29.4-alpine
    ports:
      - 8000:80
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html
    depends_on:
      - rp_php

  rp_php:
    container_name: rp_php
    build:
      context: ./docker/php
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - rp_redis

  # php:
